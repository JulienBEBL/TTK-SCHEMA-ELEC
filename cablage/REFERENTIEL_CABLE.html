<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTK : référentiel câble</title><style>:root{--bg:#fff;--card:#f7f6f2;--t1:#1f1e1b;--t2:#5f5e5a;--bd:#d3d1c7}
@media (prefers-color-scheme:dark){:root{--bg:#1f1e1b;--card:#2c2c2a;--t1:#f1efe8;--t2:#b4b2a9;--bd:#444441}}
body{background:var(--bg);color:var(--t1);font:14px/1.5 Arial,sans-serif;margin:16px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}p.s{color:var(--t2);margin:0 0 14px;font-size:13px}
.z{margin:0 0 18px}.zt{font-size:15px;font-weight:600;margin:0 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.k{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;background:var(--card)}
.kn{font-weight:600}.ks{font-size:12px;color:var(--t2);display:block;margin-bottom:6px}
.r{display:grid;grid-template-columns:48px 1fr auto;gap:6px;font-size:12px;padding:1px 0 1px 6px;border-left:3px solid var(--bd);margin:2px 0}
.r .b,.r .c{font-family:Consolas,monospace;color:var(--t2);font-size:11px}.r .b{text-align:right}
.lib{opacity:.6;border-left-style:dashed}.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--t2);margin:0 0 14px}
.lg span{display:flex;align-items:center;gap:5px}.sw{width:12px;height:12px;border-radius:2px;display:inline-block}</style></head><body><h1>TTK : référentiel câble</h1><p class="s">Câbles électriques qui sortent de l'armoire, conducteur par conducteur (schéma v31, 17/11/2026). Source : cablage/TTK_CABLES.xlsx, onglet Conducteurs.</p><div class="lg" id="lg"></div><div id="out"></div><script>const F={"S": ["Sécurité", "#D85A30"], "A": ["Automate / signal", "#7F77DD"], "P": ["Puissance", "#BA7517"], "V": ["Alimentation 24 V / 0 V", "#378ADD"], "T": ["Terre", "#639922"], "L": ["Libre", "#888780"]};const Z=[["Vers le pupitre +P1", [["W11", "27G1 LIYCY-JZ", "22 + V/J utilisés, 4 libres", [["1", "S", "AU S2 voie 1, entrée", "X41.11"], ["2", "S", "AU S2 voie 1, sortie", "X41.12"], ["3", "S", "AU S2 voie 2, entrée", "X41.13"], ["4", "S", "AU S2 voie 2, sortie", "X41.14"], ["5", "A", "AU S2 NO, 24 V", "X60.11"], ["6", "A", "AU S2 NO → I0.0", "X60.12"], ["7", "S", "Manu : shunt capot voie 1", "X41.21"], ["8", "S", "shunt voie 1 → KA1 S12", "X41.22"], ["9", "S", "Manu : shunt capot voie 2", "X41.23"], ["10", "S", "shunt voie 2 → KA1 S22", "X41.24"], ["11", "S", "MANU-D : 24 V après KA1", "X42.11"], ["12", "S", "MANU-D → bobine KA2 (48 V)", "X42.12"], ["13", "S", "AUTO-A : 24 V après KA1", "X42.13"], ["14", "S", "AUTO-A → KM1 / KM2", "X42.14"], ["15", "S", "AUTO-B : 24 V après KA1", "X42.15"], ["16", "S", "AUTO-B → STO variateurs", "X42.16"], ["17", "A", "Info Auto, 24 V", "X60.21"], ["18", "A", "Info Auto → I0.4", "X60.22"], ["19", "A", "Info Manu, 24 V", "X60.23"], ["20", "A", "Info Manu → I0.5", "X60.24"], ["21", "V", "IHM +24 V", "X50.11"], ["22", "V", "IHM 0 V", "X50.12"], ["V/J", "T", "Terre IHM, masse pupitre", "X50.13"], ["23", "L", "libre", ""], ["24", "L", "libre", ""], ["25", "L", "libre", ""], ["26", "L", "libre", ""]]]]], ["Vers la boîte machine +M-X1", [["W12", "19G1 LIYCY-JZ", "16 + V/J utilisés, 2 libres", [["1", "S", "Capot B1 voie 1 (NF)", "X41.31"], ["2", "S", P", "M4 B+", "X20.23"], ["4", "P", "M4 B-", "X20.24"], ["V/J", "T", "Terre du moteur M4 (Julien)", "XPE1"]]], ["W14", "M12 8 cond. SICK", "capot B2, couleurs à relever", [["?", "S", "Capot B2 voie 2", "X41.41"], ["?", "S", "B2 voie 2 → KA1 S22", "X41.42"], ["?", "A", "Capot B2 info, 24 V", "X41.43"], ["?", "A", "Capot B2 → I0.3", "X41.44"], ["x 4", "L", "4 conducteurs libres", ""]]], ["W8", "Compensation K 236-3959", "thermocouple B7", [["vert +", "A", "B7 + → K3 AI0", "X63.11"], ["blanc -", "A", "B7 - → K3 AI0", "X63.12"]]], ["W13", "Fil V/J 4 mm²", "bâti machine", [["V/J", "T", "Liaison équipotentielle", "XPE1"]]]]]];document.getElementById('lg').innerHTML=Object.values(F).map(([n,c])=>`<span><i class="sw" style="background:${c}"></i>${n}</span>`).join('');
document.getElementById('out').innerHTML=Z.map(([t,cs])=>`<div class="z"><div class="zt">${t}</div><div class="g">${cs.map(([rep,des,sub,rows])=>`<div class="k"><span class="kn">${rep} · ${des}</span><span class="ks">${sub}</span>${rows.map(([n,f,txt,b])=>`<div class="r${f==='L'||f==='res'?' lib':''}" style="border-left-color:${F[f][1]}"><span class="c">${n}</span><span>${txt}</span><span class="b">${b}</span></div>`).join('')}</div>`).join('')}</div></div>`).join('');</script></body></html>
