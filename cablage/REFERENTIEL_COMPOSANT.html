<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTK : référentiel composant</title><style>:root{--bg:#fff;--card:#f7f6f2;--t1:#1f1e1b;--t2:#5f5e5a;--bd:#d3d1c7}
@media (prefers-color-scheme:dark){:root{--bg:#1f1e1b;--card:#2c2c2a;--t1:#f1efe8;--t2:#b4b2a9;--bd:#444441}}
body{background:var(--bg);color:var(--t1);font:14px/1.5 Arial,sans-serif;margin:16px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}p.s{color:var(--t2);margin:0 0 14px;font-size:13px}
.z{margin:0 0 18px}.zt{font-size:15px;font-weight:600;margin:0 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.k{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;background:var(--card)}
.kn{font-weight:600}.ks{font-size:12px;color:var(--t2);display:block;margin-bottom:6px}
.r{display:grid;grid-template-columns:48px 1fr auto;gap:6px;font-size:12px;padding:1px 0 1px 6px;border-left:3px solid var(--bd);margin:2px 0}
.r .b,.r .c{font-family:Consolas,monospace;color:var(--t2);font-size:11px}.r .b{text-align:right}
.lib{opacity:.6;border-left-style:dashed}.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--t2);margin:0 0 14px}

document.getElementById('out').innerHTML=Z.map(([t,cs])=>`<div class="z"><div class="zt">${t}</div><div class="g">${cs.map(([rep,des,sub,rows])=>`<div class="k"><span class="kn">${rep} · ${des}</span><span class="ks">${sub}</span>${rows.map(([n,f,txt,b])=>`<div class="r${f==='L'||f==='res'?' lib':''}" style="border-left-color:${F[f][1]}"><span class="c">${n}</span><span>${txt}</span><span class="b">${b}</span></div>`).join('')}</div>`).join('')}</div></div>`).join('');</script></body></html>
